settings:
  # 单次运行每个账号最多拉取详情的新笔记数（防止首日全量拉爆）
  max_details_per_user: 30
  # 笔记详情请求之间随机间隔（秒）
  detail_sleep: [5, 15]
  # 账号之间随机间隔（秒）
  user_sleep: [30, 60]
  # 是否下载新笔记的无水印图片到 data/notes/<note_id>/images/
  download_media: false
  # 是否每次运行都发送报告邮件（false 时仅在新增笔记/异常时发送）
  always_mail: true

